name: study_companion
description: AI Study Companion — upload notes, get AI explanations, flashcards, quizzes & study plans.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP
  dio: ^5.7.0

  # Secure local storage (JWT token)
  flutter_secure_storage: ^9.2.2

  # File picker (PDFs, slides)
  file_picker: ^8.1.2

  # Shared preferences (settings)
  shared_preferences: ^2.3.3

  # Markdown rendering (AI responses)
  flutter_markdown: ^0.7.4

  # Date picker
  table_calendar: ^3.1.2

  # Loading indicators
  shimmer: ^3.0.0

  # Toast / snackbars
  fluttertoast: ^8.2.8

  # Icons
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
